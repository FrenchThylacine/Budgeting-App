<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Budget OS — personal budgeting</title>
    <meta
      name="description"
      content="Spending, recurring activities, wishlist, analytics and reports — synchronised across your devices."
    />

    <!--
      Two theme colours, so the browser chrome matches the page rather than
      fighting it. A single value left a navy bar above a white app in light
      mode, which reads as a rendering fault rather than as a choice.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F8FB" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#031E49" />

    <!--
      The identity is the A350 fin artwork supplied by the owner, kept at
      `assets/brand/air-france-fin.jpg` and derived into every size here by
      `scripts/build-icons.mjs`.

      Two framings, deliberately. The home-screen icons keep the artwork's own
      margin, which a launcher needs. The tab icons are cropped to the fin, so
      the shape fills a 16px tile instead of floating in a quarter-width band of
      empty navy — and each size is rendered from the 1024px original rather
      than downsampled from one large PNG, which is what turns a fin into a
      smudge.

      No SVG: the artwork is a raster with gradients, so a vector version would
      be a redrawing rather than the supplied image. The ICO carries 16, 32 and
      48; the two PNGs serve browsers that prefer one, including at 2×.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="apple-mobile-web-app-title" content="Budget OS" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- A private financial tool has no business being indexed or previewed. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="light dark" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
