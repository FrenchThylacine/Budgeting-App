<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Budget OS</title>
  <!--
    The browser-tab mark.

    Not the A350 illustration shrunk down: at 16 pixels a wide-body seen from
    above is four grey smudges and a line. What survives at that size is one
    bold silhouette and two colours, so the mark is the part of an airliner
    that is a silhouette even in life — the swept vertical fin — on the navy
    ground the application uses, with the signature red as a single flash
    across its base.

    Solid fills and straight edges only, so it rasterises identically at 16,
    32, 180 and 512, and so the 16px version is a recognisable shape rather
    than an anti-aliased suggestion of one.
  -->
  <rect width="64" height="64" rx="14" fill="#002157"/>
  <!-- The fin: leading edge swept back about 45°, trailing edge near-vertical. -->
  <path d="M14 50 L34 13 L43 13 L49 50 Z" fill="#F6F9FF"/>
  <!-- The flash. Its corners are the fin's own edges solved at y=43.7, so the
       band sits flush inside the silhouette instead of leaving a sliver of
       white poking out at the base — which at 16px reads as a rendering fault. -->
  <path d="M17.4 43.7 L48 43.7 L49 50 L14 50 Z" fill="#E4002B"/>
</svg>
