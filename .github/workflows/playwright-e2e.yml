name: Playwright E2E (opt-in)

on:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_RUN: ${{ secrets.PLAYWRIGHT_RUN || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Install Playwright browsers (optional)
        if: env.PLAYWRIGHT_RUN == 'true'
        run: npx playwright install --with-deps

      - name: Run Playwright E2E (optional)
        if: env.PLAYWRIGHT_RUN == 'true'
        run: npx playwright test --reporter=github
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
